name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/transaction/committed-details -H 'Content-Type: application/json' \
            -d '{"intent_hash":"txid_tdx_2_1t5n69x33cad9zvcj4ke6c2unrc8jhkurzf3ce0kmk2983fsswnesec4cg3","opt_ins":{"affected_global_entities":true}}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);t=d['transaction'];print('STATUS',t['transaction_status'], t.get('error_message'));[print('ENTITY',e) for e in t.get('affected_global_entities',[]) if e.startswith('component') or e.startswith('resource')]" > out.txt; cat out.txt
          c=$(grep -o 'component_tdx_2_1[a-z0-9]*' out.txt | grep -v 'cptxxxxxxx' | head -1)
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' -d "{\"addresses\":[\"$c\"]}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);f=d['items'][0]['details']['state']['fields'];[print('FIELD',x.get('field_name'),json.dumps(x)[:600]) for x in f if x.get('field_name')=='tokens']"
