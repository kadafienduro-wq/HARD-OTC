name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' \
            -d '{"addresses":["package_tdx_2_1phq74rsmk08y99jmm624xu5z25lcvlnmwqx4vyd2qk8nvsmh7twr7p"],"opt_ins":{"package_blueprints":true}}' > p.json
          for f in request_unlock withdraw_unlocked set_listing_fee set_burn_share unlock_hard; do echo "CHECK $f $(grep -c "\"$f\"" p.json)"; done
