name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' \
            -d '{"addresses":["package_tdx_2_1p47uc6l6evy8fa6jjuurctwa0tsp4phcwwjce92rwxrsv385xxnevt"],"opt_ins":{"package_blueprints":true}}' > p.json
          for f in request_lsu_sale accept_lsu_sale deposit_pool settle_pool set_reservation_fee promote_offer add_verified mint_rider_badge; do echo "CHECK $f $(grep -c "\"$f\"" p.json)"; done
