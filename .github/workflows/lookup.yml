name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/transaction/committed-details \
            -H 'Content-Type: application/json' \
            -d '{"intent_hash":"txid_tdx_2_1ckrsjjh9gnwpmw0sp36hyn09lzp6p5wj3d25nrcnalmdvcmwf00qav6lyx","opt_ins":{"affected_global_entities":true}}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);t=d['transaction'];print('STATUS',t['transaction_status']);[print('ENTITY',e) for e in t.get('affected_global_entities',[])]"
