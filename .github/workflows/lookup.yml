name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/transaction/committed-details -H 'Content-Type: application/json' \
            -d '{"intent_hash":"txid_tdx_2_1k6kprms7uf9529c0x4nvacepaagyvqsg52xcr2vpuuevtzylcjpqthu6q5"}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);t=d['transaction'];print('STATUS',t['transaction_status'], t.get('error_message'))"
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' -d '{"addresses":["component_tdx_2_1cr8uef5n7vmar78mumlxhrv5luj6kyjt9e4lm7ym2et7aenn5deq87"]}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);f=d['items'][0]['details']['state']['fields'];[print('FIELD',x.get('field_name'),x.get('value')) for x in f if x.get('field_name') in ('faucet_amount','lsu_enabled','lsu_payout','lsu_xrd_share','listing_fee_hard','promotion_fee_hard','reservation_fee_hard','fee_rate_per_side','lsu_max_value_per_tx','lsu_daily_limit','listing_fee','promotion_fee','reservation_fee')]"
