name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for T in txid_tdx_2_1p5u2vtpg77xmuu32wxe7ws607zg8qj7jd20p6x79awe0gwzn664seexj4a; do
          curl -s -X POST https://stokenet.radixdlt.com/transaction/committed-details -H 'Content-Type: application/json' \
            -d "{\"intent_hash\":\"$T\",\"opt_ins\":{\"affected_global_entities\":true}}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);t=d['transaction'];print('STATUS',t['transaction_status'],t.get('error_message'));[print('ENTITY',e) for e in t.get('affected_global_entities',[])]"
          done
