name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://kadafienduro-wq.github.io/HARD-OTC/ https://kadafienduro-wq.github.io/HARD-OTC/mainnet/; do echo "SITE $u $(curl -s -o /dev/null -w '%{http_code}' $u)"; done
