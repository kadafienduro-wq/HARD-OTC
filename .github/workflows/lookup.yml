name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' \
            -d '{"addresses":["component_tdx_2_1cpwp59jnv62skzepkew9hxf998cwjs92epz4nksvp4526c52u77840"]}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);f=d['items'][0]['details']['state']['fields'];[print('FIELD',x.get('field_name'),x.get('value')) for x in f if x.get('field_name') in ('hard_resource','admin_badge')]"
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' \
            -d '{"addresses":["package_tdx_2_1p4jdg8zqjkv775az3qytlwqjwl5pg9x4jcmdwaalnlaxt5wc4428ze"],"opt_ins":{"package_blueprints":true}}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);s=json.dumps(d);print('HAS_LIMITS','set_lsu_limits' in s, 'HAS_SPLIT','set_lsu_split' in s)"
