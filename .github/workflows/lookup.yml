name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' -d '{"addresses":["component_tdx_2_1cr8uef5n7vmar78mumlxhrv5luj6kyjt9e4lm7ym2et7aenn5deq87"]}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);f=d['items'][0]['details']['state']['fields'];[print('FIELD',x.get('field_name'),x.get('value')) for x in f if x.get('field_name') in ('faucet_given','faucet_amount')]"
          curl -s -X POST https://stokenet.radixdlt.com/state/entity/details -H 'Content-Type: application/json' -d '{"addresses":["account_tdx_2_129j3eukj5fyylr8l7ehg7ug377hzpvnfywvv0k3dxqn9tzn84lmvzp"],"aggregation_level":"Global"}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print('BAL',i['resource_address'][-10:],i['amount']) for i in d['items'][0]['fungible_resources']['items']]"
          curl -s -X POST https://stokenet.radixdlt.com/stream/transactions -H 'Content-Type: application/json' -d '{"affected_global_entities_filter":["component_tdx_2_1cr8uef5n7vmar78mumlxhrv5luj6kyjt9e4lm7ym2et7aenn5deq87"],"limit_per_page":15,"opt_ins":{"affected_global_entities":true}}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print('TX',t['intent_hash'][-8:],t['transaction_status'],t.get('confirmed_at'),[e for e in t.get('affected_global_entities',[]) if e.startswith('account')]) for t in d['items']]"
