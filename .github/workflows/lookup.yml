name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://stokenet.radixdlt.com
          D=component_tdx_2_1cqzf2t5mnpc95d4zln4xxxhqhl75c0vnyud7s0rrns498fehdgxmp3
          curl -s -X POST $G/state/entity/details -H 'Content-Type: application/json' -d "{\"addresses\":[\"$D\"]}" > d.json
          python3 - <<'PY'
          import json
          d=json.load(open('d.json'))['items'][0]['details']['state']['fields']
          st={x['field_name']:x for x in d}
          for k in ['next_offer_id','next_lsu_id','rider_badge','lsu_xrd_paid','lsu_hard_paid','paused']:
              if k in st: print('STATE',k,st[k].get('value'))
          PY
          RB=$(python3 -c "import json;d=json.load(open('d.json'))['items'][0]['details']['state']['fields'];print([x['value'] for x in d if x['field_name']=='rider_badge'][0])")
          curl -s -X POST $G/state/entity/details -H 'Content-Type: application/json' -d "{\"addresses\":[\"$RB\"]}" | python3 -c "import sys,json;d=json.load(sys.stdin);print('BADGES',d['items'][0]['details'].get('total_supply'))"
          curl -s -X POST $G/stream/transactions -H 'Content-Type: application/json' -d "{\"affected_global_entities_filter\":[\"$D\"],\"limit_per_page\":100}" | python3 -c "import sys,json;d=json.load(sys.stdin);it=d['items'];print('TXS',len(it),'failed',sum(1 for t in it if t['transaction_status']!='CommittedSuccess'))"
          curl -s -X POST $G/stream/transactions -H 'Content-Type: application/json' -d '{"affected_global_entities_filter":["component_tdx_2_1cq94zykxeg8uvs53v584z0amnjra4rk6px4dtdeclkvng4p8gxlyl3"],"limit_per_page":100}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('FAUCET_TXS',len(d['items']))"
