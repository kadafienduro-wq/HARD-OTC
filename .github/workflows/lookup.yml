name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://stokenet.radixdlt.com
          curl -s -X POST $G/stream/transactions -H 'Content-Type: application/json' \
            -d '{"affected_global_entities_filter":["account_tdx_2_129j3eukj5fyylr8l7ehg7ug377hzpvnfywvv0k3dxqn9tzn84lmvzp"],"limit_per_page":4,"order":"Desc","opt_ins":{"affected_global_entities":true}}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print('TX',i['intent_hash'],i['confirmed_at'],[e for e in i.get('affected_global_entities',[]) if e.startswith(('package','component','resource'))]) for i in d['items']]"
          KVS=$(curl -s -X POST $G/state/entity/details -H 'Content-Type: application/json' -d '{"addresses":["component_tdx_2_1cpuj7t6ycgxuy7yfu6vk0mjtsrf05a0etweelzvqmzwfexxeqy2g9d"]}' | python3 -c "import sys,json;d=json.load(sys.stdin);s=d['items'][0]['details']['state']['fields'];print([f['value'] for f in s if f['field_name']=='offers'][0]);import sys;print([f['value'] for f in s if f['field_name']=='next_offer_id'][0],file=sys.stderr)")
          KEYS=$(python3 -c "print(','.join('{\"key_json\":{\"kind\":\"U64\",\"value\":\"%d\"}}'%i for i in range(1,15)))")
          curl -s -X POST $G/state/key-value-store/data -H 'Content-Type: application/json' -d "{\"key_value_store_address\":\"$KVS\",\"keys\":[$KEYS]}" \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for e in d.get('entries',[]):
              f={x['field_name']:x for x in e['value']['programmatic_json']['fields']}
              print('OFFER',e['key']['programmatic_json']['value'],f['status']['variant_name'],f['sell_amount']['value'],f['sell_resource']['value'][-8:],'for',f['ask_amount']['value'],f['ask_resource']['value'][-8:],'exp',f['expires_at']['value'],'res',f['reserved_buyer']['variant_name'],'seller',f['seller_account']['value'][-10:])
          "
          date +%s
