name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for base in https://kadafienduro-wq.github.io/HARD-OTC/ https://kadafienduro-wq.github.io/HARD-OTC/mainnet/; do
            curl -s $base -o p.html; js=$(grep -o 'assets/[^"]*\.js' p.html | head -1)
            curl -s "$base$js" -o a.js
            echo "SITE $base js=$js safety=$(grep -c 'Blocked for safety' a.js) mainnetgw=$(grep -c 'mainnet.radixdlt.com' a.js) desk=$(grep -o 'component_tdx_2_1cpv03[a-z0-9]*' a.js | head -1)"
            grep -o 'VITE_NETWORK[^,;]*\|"mainnet"===[^?]*?' a.js | head -2 | sed 's/^/NETCHK /'
          done
