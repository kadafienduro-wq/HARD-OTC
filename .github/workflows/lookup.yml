name: Odczyt transakcji
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://api.ociswap.com/tokens/resource_rdx1thh4yr9k393uc4x45n4u9l7h57804qdhxxzdw2dpmu8cjpm6ueujpn | python3 -c "import sys,json;d=json.load(sys.stdin);print('OCI', json.dumps({k:d.get(k) for k in ('symbol','price','tvl','volume','total_supply')}))"
          curl -s https://api.ociswap.com/tokens/resource_rdx1tknxxxxxxxxxradxrdxxxxxxxxx009923554798xxxxxxxxxradxrd | python3 -c "import sys,json;d=json.load(sys.stdin);print('XRDUSD', json.dumps(d.get('price')))"
          curl -s "https://api.ociswap.com/pools?token=resource_rdx1thh4yr9k393uc4x45n4u9l7h57804qdhxxzdw2dpmu8cjpm6ueujpn&limit=5" | head -c 3000 | sed 's/^/POOLS /'
