name: Odczyt ofert
on:
  push:
    paths: ['.github/workflows/lookup.yml']
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://stokenet.radixdlt.com
          S=$(curl -s -X POST $G/state/entity/details -H 'Content-Type: application/json' -d '{"addresses":["component_tdx_2_1cpuj7t6ycgxuy7yfu6vk0mjtsrf05a0etweelzvqmzwfexxeqy2g9d"]}')
          echo "$S" | python3 -c "import sys,json;d=json.load(sys.stdin);print('STATE',json.dumps(d['items'][0]['details']['state']))"
          KVS=$(echo "$S" | python3 -c "import sys,json;d=json.load(sys.stdin);print([f['value'] for f in d['items'][0]['details']['state']['fields'] if f.get('field_name')=='offers'][0])")
          curl -s -X POST $G/state/key-value-store/data -H 'Content-Type: application/json' -d "{\"key_value_store_address\":\"$KVS\",\"keys\":[{\"key_json\":{\"kind\":\"U64\",\"value\":\"1\"}},{\"key_json\":{\"kind\":\"U64\",\"value\":\"2\"}},{\"key_json\":{\"kind\":\"U64\",\"value\":\"3\"}}]}" | python3 -c "import sys,json;d=json.load(sys.stdin);[print('OFFER',json.dumps(e['value']['programmatic_json'])) for e in d.get('entries',[])];print('RAW',json.dumps(d)[:300])"
