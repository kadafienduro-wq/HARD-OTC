name: Buduj HARD OTC

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrakt:
    name: Kontrakt Scrypto (wasm + rpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.81.0 + wasm
        run: |
          rustup toolchain install 1.81.0 --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Cache Scrypto CLI
        id: cache-scrypto
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin
          key: radix-clis-1.3.0-rust-stable

      - name: Instaluj Scrypto CLI
        if: steps.cache-scrypto.outputs.cache-hit != 'true'
        env:
          CXXFLAGS: "-include cstdint"
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --locked radix-clis@1.3.0

      - name: Zapamietaj Scrypto CLI
        if: steps.cache-scrypto.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin
          key: radix-clis-1.3.0-rust-stable

      - name: Wersje bibliotek zgodne z Rust 1.81
        working-directory: scrypto
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable generate-lockfile
          python3 - <<'PY'
          import re, subprocess
          for _ in range(4):
              lock = open('Cargo.lock').read()
              bad = [(n, v) for n, v in re.findall(r'name = "((?:sbor|scrypto|radix)[\w-]*)"\nversion = "([^"]+)"', lock) if v != '1.3.0']
              print('Do cofniecia:', bad)
              if not bad:
                  break
              for n, v in bad:
                  subprocess.run(['cargo', '+stable', 'update', '-p', f'{n}@{v}', '--precise', '1.3.0'])
          PY
          grep -A1 -E '^name = "(sbor|scrypto|radix)' Cargo.lock

      - name: Buduj kontrakt
        working-directory: scrypto
        run: scrypto build

      - name: Wynik do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: kontrakt-do-wgrania
          path: |
            scrypto/target/wasm32-unknown-unknown/release/hard_otc.wasm
            scrypto/target/wasm32-unknown-unknown/release/hard_otc.rpd

  testy:
    name: Testy bezpieczenstwa kontraktu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.81.0 + wasm
        run: |
          rustup toolchain install 1.81.0 --profile minimal --target wasm32-unknown-unknown
          rustup toolchain install stable --profile minimal
          sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Wersje bibliotek zgodne z Rust 1.81
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          for d in scrypto testy; do
            (cd $d && cargo +stable generate-lockfile && python3 - <<'PY'
          import re, subprocess
          for _ in range(6):
              lock = open('Cargo.lock').read()
              bad = [(n, v) for n, v in re.findall(r'name = "((?:sbor|scrypto|radix)[\w-]*)"\nversion = "([^"]+)"', lock) if v != '1.3.0']
              print('Do cofniecia:', bad)
              if not bad:
                  break
              for n, v in bad:
                  subprocess.run(['cargo', '+stable', 'update', '-p', f'{n}@{v}', '--precise', '1.3.0'])
          PY
            )
          done
      - uses: actions/cache@v4
        with:
          path: |
            testy/target
            ~/.cargo/registry
          key: testy-${{ hashFiles('testy/Cargo.lock') }}
      - name: Uruchom testy
        working-directory: testy
        run: cargo test --release -- --test-threads=2 --nocapture

  strona:
    name: Strona (budowa)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buduj front
        working-directory: frontend
        run: |
          npm install
          VITE_NETWORK=stokenet npm run build
          VITE_NETWORK=mainnet npx vite build --outDir dist-mainnet
          mv dist-mainnet dist/mainnet
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  publikacja:
    name: Strona (publikacja)
    if: github.ref == 'refs/heads/main'
    needs: strona
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
